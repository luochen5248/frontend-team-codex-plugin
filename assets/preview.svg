<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c14"/>
      <stop offset="1" stop-color="#0b1723"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c2a"/>
      <stop offset="1" stop-color="#0b141e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3BF6FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3BF6FF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#13202e" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="580" fill="url(#bg)"/>
  <rect width="1000" height="580" fill="url(#grid)"/>

  <!-- 顶部标题栏 -->
  <rect width="1000" height="56" fill="#0a1320" opacity="0.85"/>
  <line x1="0" y1="56" x2="1000" y2="56" stroke="#16283a"/>
  <circle cx="24" cy="28" r="4.5" fill="#1f3a4f"/>
  <circle cx="42" cy="28" r="4.5" fill="#1f3a4f"/>
  <circle cx="60" cy="28" r="4.5" fill="#1f3a4f"/>
  <text x="84" y="34" font-size="14" fill="#cfe6f5">通用大屏前端专家团</text>
  <text x="212" y="34" font-size="14" fill="#4d6b82">/ Codex 插件工作台</text>
  <text x="976" y="34" font-size="12" fill="#5c7a91" text-anchor="end">v1.0.0 · 已启用</text>

  <!-- 左：插件卡片 -->
  <rect x="40" y="88" width="400" height="452" rx="16" fill="url(#card)" stroke="#1a2f42"/>
  <rect x="68" y="116" width="76" height="76" rx="18" fill="#0c1a27" stroke="#1d3a4f"/>
  <text x="92" y="170" font-size="46" font-weight="bold" fill="#3BF6FF" text-anchor="middle" filter="url(#glow)">{</text>
  <text x="122" y="170" font-size="46" font-weight="bold" fill="#3BF6FF" text-anchor="middle" filter="url(#glow)">}</text>
  <text x="164" y="146" font-size="18" fill="#e8f6ff">通用大屏前端专家团</text>
  <text x="164" y="170" font-size="11.5" fill="#5f7d94">frontend-team · 1 个编排 + 6 个成员</text>
  <line x1="68" y1="216" x2="412" y2="216" stroke="#17293a"/>

  <text x="68" y="252" font-size="12.5" fill="#8aa3b8">大屏 GIS 前端、移动端 H5、UI 设计、质量治理</text>
  <text x="68" y="274" font-size="12.5" fill="#8aa3b8">（代码评审 / 代码简化 / 交付门控）组成多角色</text>
  <text x="68" y="296" font-size="12.5" fill="#8aa3b8">协作团队，按四阶段推进并自动路由。</text>

  <rect x="68" y="336" width="70" height="24" rx="12" fill="#0e2531" stroke="#1f4b5c"/>
  <text x="103" y="352" font-size="11.5" fill="#7fd6e6" text-anchor="middle">大屏 GIS</text>
  <rect x="146" y="336" width="82" height="24" rx="12" fill="#0e2531" stroke="#1f4b5c"/>
  <text x="187" y="352" font-size="11.5" fill="#7fd6e6" text-anchor="middle">移动端 H5</text>
  <rect x="236" y="336" width="66" height="24" rx="12" fill="#0e2531" stroke="#1f4b5c"/>
  <text x="269" y="352" font-size="11.5" fill="#7fd6e6" text-anchor="middle">Cesium</text>

  <rect x="68" y="396" width="118" height="40" rx="9" fill="#0d2a33" stroke="#3BF6FF"/>
  <text x="127" y="421" font-size="13.5" fill="#3BF6FF" text-anchor="middle">已安装</text>
  <rect x="198" y="396" width="118" height="40" rx="9" fill="none" stroke="#24425a"/>
  <text x="257" y="421" font-size="13.5" fill="#7f9bb0" text-anchor="middle">查看详情</text>

  <text x="68" y="474" font-size="11.5" fill="#5f7d94">质量门控：交付前强制过 交付自检 → 代码评审 → 代码简化</text>
  <rect x="68" y="494" width="344" height="3" rx="1.5" fill="url(#bar)"/>

  <!-- 右：专家团四阶段协作 -->
  <rect x="468" y="88" width="492" height="452" rx="16" fill="url(#card)" stroke="#1a2f42"/>
  <text x="496" y="132" font-size="16" fill="#e8f6ff">专家团四阶段协作</text>
  <text x="496" y="154" font-size="11.5" fill="#5f7d94">路由规则按任务类型决定每一次该谁上场</text>

  <!-- 阶段 1 -->
  <rect x="496" y="176" width="208" height="150" rx="13" fill="#0d1a26" stroke="#1c3a50"/>
  <circle cx="527" cy="207" r="13" fill="#0f2b36" stroke="#3BF6FF"/>
  <text x="527" y="212" font-size="12" fill="#3BF6FF" text-anchor="middle">1</text>
  <text x="550" y="212" font-size="14" fill="#d9edf9">立项对齐</text>
  <text x="514" y="248" font-size="11" fill="#8aa3b8">大屏 GIS 前端规范</text>
  <text x="514" y="270" font-size="11" fill="#8aa3b8">移动端 H5 规范</text>
  <text x="514" y="292" font-size="11" fill="#5f7d94">先定技术栈与边界</text>

  <!-- 阶段 2 -->
  <rect x="724" y="176" width="208" height="150" rx="13" fill="#0d1a26" stroke="#1c3a50"/>
  <circle cx="755" cy="207" r="13" fill="#0f2b36" stroke="#3BF6FF"/>
  <text x="755" y="212" font-size="12" fill="#3BF6FF" text-anchor="middle">2</text>
  <text x="778" y="212" font-size="14" fill="#d9edf9">实现</text>
  <text x="742" y="248" font-size="11" fill="#8aa3b8">UI 设计与界面打磨</text>
  <text x="742" y="270" font-size="11" fill="#8aa3b8">页面与接口开发</text>
  <text x="742" y="292" font-size="11" fill="#5f7d94">按平台规范落地</text>

  <!-- 阶段 3 -->
  <rect x="496" y="340" width="208" height="150" rx="13" fill="#0d1a26" stroke="#1c3a50"/>
  <circle cx="527" cy="371" r="13" fill="#0f2b36" stroke="#3BF6FF"/>
  <text x="527" y="376" font-size="12" fill="#3BF6FF" text-anchor="middle">3</text>
  <text x="550" y="376" font-size="14" fill="#d9edf9">质量治理</text>
  <text x="514" y="412" font-size="11" fill="#8aa3b8">代码评审</text>
  <text x="514" y="434" font-size="11" fill="#8aa3b8">代码简化</text>
  <text x="514" y="456" font-size="11" fill="#5f7d94">核对需求与设计偏离</text>

  <!-- 阶段 4 -->
  <rect x="724" y="340" width="208" height="150" rx="13" fill="#0d1a26" stroke="#1c3a50"/>
  <circle cx="755" cy="371" r="13" fill="#0f2b36" stroke="#3BF6FF"/>
  <text x="755" y="376" font-size="12" fill="#3BF6FF" text-anchor="middle">4</text>
  <text x="778" y="376" font-size="14" fill="#d9edf9">交付</text>
  <text x="742" y="412" font-size="11" fill="#8aa3b8">交付前自检门控</text>
  <text x="742" y="434" font-size="11" fill="#8aa3b8">拦截伪阻断与半途交付</text>
  <text x="742" y="456" font-size="11" fill="#5f7d94">自检通过才交付</text>

  <text x="496" y="516" font-size="11" fill="#5f7d94">零依赖 · 纯 Markdown 技能，安装后即可用触发词唤起专家团</text>
</svg>